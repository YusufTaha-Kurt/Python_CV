[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goru"
version = "1.0.0"
description = "Bilgisayarlı görü ile bilgisayar kontrolü: MediaPipe + OpenCV ile el, yüz, vücut ve nesne tabanlı yetenekler"
authors = [{ name = "Yusuf Taha Kurt" }]
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.30",
    "numpy>=1.26",
    "PyAutoGUI>=0.9.54",
    "pycaw>=20240210; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["goru"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["uctan_uca: gerçek modellerle dersleri çalıştıran yavaş testler (mediapipe gerekir)"]
