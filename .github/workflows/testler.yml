name: Testler

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Birim testleri kamera ve MediaPipe gerektirmez (uçtan uca testler kendini atlar).
      # Çizim ve solvePnP için ekransız OpenCV; sürüm, mediapipe'ın getirdiği OpenCV ile aynı.
      - run: pip install numpy pytest opencv-python-headless==4.13.0.92
      - run: pytest -v
