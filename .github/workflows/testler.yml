name: Testler

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Saf mantık testleri (jestler, filtreler, olay yolu) kamera ve mediapipe gerektirmez
      - run: pip install numpy pytest
      - run: pytest -v
